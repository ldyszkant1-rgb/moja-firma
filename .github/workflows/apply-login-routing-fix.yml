name: Apply login routing fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace unknown-device gate
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/App.jsx")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"\n  if \(!authSession && !deviceUser\) \{.*?\n  \}\n\n  if \(authSession && !authOrganizationId\) \{",
              re.S,
          )

          replacement = """
          if (!authSession && !deviceUser) {
            return <AuthPage />
          }

          if (authSession && !authOrganizationId) {
          """

          updated, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              raise SystemExit("Nie znaleziono oczekiwanego gate logowania urządzenia.")

          path.write_text(updated, encoding="utf-8")
          print("Zmieniono routing: nowe/nieznane urządzenie trafia do AuthPage.")

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-login-routing-fix.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/apply-login-routing-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Popraw routing logowania nowych użytkowników [skip ci]"
          git push
