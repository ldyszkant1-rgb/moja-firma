name: Finance calculation tests

on:
  pull_request:
    paths:
      - 'src/lib/financeCostCalculations.js'
      - 'tests/financeCostCalculations.test.js'
      - 'src/App.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finance-calculations.yml'

permissions:
  contents: read

jobs:
  finance-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test finance calculations
        run: npm run test:finance
      - name: Build app
        run: npm run build
