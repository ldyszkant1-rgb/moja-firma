name: Finance calculation tests

on:
  pull_request:
    paths:
      - 'src/lib/financeCostCalculations.js'
      - 'src/lib/documentationAttachments.js'
      - 'src/lib/jobsApi.js'
      - 'src/lib/storageFiles.js'
      - 'tests/documentationAttachments.test.js'
      - 'tests/storageFiles.test.js'
      - 'tests/financeCostCalculations.test.js'
      - 'src/App.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finance-calculations.yml'

permissions:
  contents: read

jobs:
  finance-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: node --test tests/*.test.js
      - name: Build app
        run: npm run build
