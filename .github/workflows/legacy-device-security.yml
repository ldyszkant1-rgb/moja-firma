name: Legacy device security guard

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-legacy-device-migration.mjs'
      - 'tests/storageMigrationContract.test.js'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/legacy-device-security.yml'
  push:
    branches:
      - main
      - fix/lock-legacy-device-enrollment

permissions:
  contents: read

jobs:
  migration-contract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=commonjs -e '
            const audit = require("./npm-audit-report.json");
            const summary = audit.metadata?.vulnerabilities ?? {};
            console.log("npm audit summary:", JSON.stringify(summary));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                affectedRange: item.range,
                fixAvailable: item.fixAvailable,
                advisories: (item.via ?? []).map(v => typeof v === "string" ? v : ({
                  name: v.name, title: v.title, url: v.url, range: v.range
                }))
              }));
            }
          '
      - name: Check legacy device migration contract
        run: node scripts/check-legacy-device-migration.mjs
      - name: Check Storage migration contract
        run: node --test tests/storageMigrationContract.test.js
      - name: Build app
        run: npm run build
