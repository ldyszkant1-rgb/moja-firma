name: PostgreSQL financial guard tests

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/postgres/**'
      - '.github/workflows/postgres-finance-guards.yml'

permissions:
  contents: read

jobs:
  financial-guard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aeroinstal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aeroinstal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Check canonical profit distribution schema contract
        run: |
          migration=supabase/migrations/20261007170000_add_profit_distribution_tracking.sql
          grep -Eiq "status text not null default 'active' check" "$migration"
          grep -Eiq "reversed_at timestamptz" "$migration"
          grep -Eiq "reversal_reason text" "$migration"
          grep -Eiq "reversed_from_id uuid" "$migration"
      - name: Create isolated synthetic schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d aeroinstal_test -v ON_ERROR_STOP=1 -f tests/postgres/setup.sql
      - name: Apply financial guard migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d aeroinstal_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261011190000_protect_distributed_finance_costs.sql
      - name: Test direct and nested mutations
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d aeroinstal_test -v ON_ERROR_STOP=1 -f tests/postgres/allocated-financial-rows.test.sql

  organization-delete-guard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aeroinstal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aeroinstal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create isolated synthetic schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d aeroinstal_test -v ON_ERROR_STOP=1 -f tests/postgres/setup.sql
      - name: Apply financial guard migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d aeroinstal_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261011190000_protect_distributed_finance_costs.sql
      - name: Apply organization deletion guard
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d aeroinstal_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261013180000_prevent_org_delete_with_active_distributions.sql
      - name: Test organization deletion and reversed cascade
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d aeroinstal_test -v ON_ERROR_STOP=1 -f tests/postgres/organization-delete-guard.test.sql
