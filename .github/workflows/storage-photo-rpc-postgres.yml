name: Storage photo RPC PostgreSQL integration

on:
  pull_request:
    paths:
      - 'supabase/migrations/*validate_job_photo_rpc_payloads.sql'
      - 'tests/sql/storage-photo-rpc-setup.sql'
      - 'tests/sql/storage-photo-rpc.test.sql'
      - '.github/workflows/storage-photo-rpc-postgres.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/*validate_job_photo_rpc_payloads.sql'
      - 'tests/sql/storage-photo-rpc-setup.sql'
      - 'tests/sql/storage-photo-rpc.test.sql'
      - '.github/workflows/storage-photo-rpc-postgres.yml'

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aeroinstal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aeroinstal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create isolated test schema
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: aeroinstal_test
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/storage-photo-rpc-setup.sql
      - name: Apply photo RPC migration in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: aeroinstal_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015140000_validate_job_photo_rpc_payloads.sql
      - name: Test RPC validation, duplicate IDs, organization access and grants
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: aeroinstal_test
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/storage-photo-rpc.test.sql
